# Deploy to AWS — build images → push to ECR → terraform apply → roll Fargate.
#
# MANUAL trigger only (workflow_dispatch) while in POC phase. Pick the workspace
# and whether to plan or apply. Flip to `push: branches: [master]` for
# auto-deploy once you trust it.
#
# Auth: GitHub OIDC assumes the deploy role from terraform/cicd.tf. No AWS keys
# are stored in GitHub — only the role ARN, which is not a secret.
#
# Required GitHub Actions *variables* (Settings → Secrets and variables → Actions):
#   AWS_DEPLOY_ROLE_ARN = arn:aws:iam::<acct>:role/agent-harness-github-deploy
#   AWS_REGION          = us-east-1
#
# Recommended: create GitHub Environments named `dev` and `prod`, and add
# required reviewers to `prod`. The deploy job below declares `environment:`, so
# a prod apply then pauses for approval — the standard gate for this shape of
# pipeline, and the only thing standing between the dropdown and production.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform workspace to deploy"
        type: choice
        options: [dev, prod]
        default: dev
      action:
        description: "plan = show the diff only · apply = actually deploy"
        type: choice
        options: [plan, apply]
        default: plan

# Never let two deploys touch the same environment at once — Terraform's state
# lock would reject the second one mid-run and leave a mess.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Chicken-and-egg: the build job pushes to ECR repos that Terraform creates.
  # On the FIRST deploy of a workspace they don't exist yet, so create just those
  # two resources up front. It's a no-op on every subsequent run.
  # ---------------------------------------------------------------------------
  ecr:
    name: ensure ECR repos
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Apply ECR repositories only
        env:
          ENV: ${{ inputs.environment }}
        run: |
          cd terraform
          terraform init -backend-config=backend.hcl
          terraform workspace select "$ENV" || terraform workspace new "$ENV"
          terraform apply -auto-approve -no-color -var="aws_profile=" \
            -target=aws_ecr_repository.api \
            -target=aws_ecr_repository.frontend

  # ---------------------------------------------------------------------------
  # Build both images in parallel and push them to ECR. Skipped on a plan, which
  # needs no new images (the tag variables default to `latest`).
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.image }}
    if: inputs.action == 'apply'
    needs: [ecr]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - image: api
            context: .
            dockerfile: Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64 # Fargate x86
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/agent-harness-${{ inputs.environment }}-${{ matrix.image }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/agent-harness-${{ inputs.environment }}-${{ matrix.image }}:latest
          # Layer cache lives in GitHub's cache, scoped per image so api and
          # frontend don't evict each other.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---------------------------------------------------------------------------
  # Terraform. Always plans; applies only when asked. On apply it also rolls the
  # ECS services and waits for them to stabilise, so the job fails if the new
  # task definition can't actually start.
  # ---------------------------------------------------------------------------
  deploy:
    name: terraform ${{ inputs.action }} (${{ inputs.environment }})
    needs: [ecr, build]
    # `always()` so a plan still runs even though `ecr`/`build` were skipped.
    if: always() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      ENV: ${{ inputs.environment }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # terraform_wrapper mangles stdout, which breaks `terraform output` capture.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init and select workspace
        run: |
          cd terraform
          terraform init -backend-config=backend.hcl
          terraform workspace select "$ENV" || terraform workspace new "$ENV"

      # NOTE: the plan is deliberately NOT uploaded as an artifact. It contains
      # random_password.db in cleartext, and artifacts are downloadable by anyone
      # with repo read access. The apply below re-plans internally instead.
      - name: Plan
        run: |
          cd terraform
          terraform plan -no-color \
            -var="aws_profile=" \
            -var="api_image_tag=${TAG}" \
            -var="frontend_image_tag=${TAG}"

      - name: Apply
        if: inputs.action == 'apply'
        run: |
          cd terraform
          terraform apply -auto-approve -no-color \
            -var="aws_profile=" \
            -var="api_image_tag=${TAG}" \
            -var="frontend_image_tag=${TAG}"

      # Task definitions pin the :latest tag, so a same-tag push needs an explicit
      # roll for ECS to pull the new image.
      - name: Roll ECS services
        if: inputs.action == 'apply'
        run: |
          for svc in api worker frontend; do
            aws ecs update-service --cluster "agent-harness-$ENV" \
              --service "agent-harness-$ENV-$svc" --force-new-deployment >/dev/null
            echo "rolled $svc"
          done

      - name: Wait for services to stabilise
        if: inputs.action == 'apply'
        run: |
          aws ecs wait services-stable \
            --cluster "agent-harness-$ENV" \
            --services "agent-harness-$ENV-api" \
                       "agent-harness-$ENV-worker" \
                       "agent-harness-$ENV-frontend"

      - name: Post-deploy smoke test
        if: inputs.action == 'apply'
        run: |
          cd terraform
          url=$(terraform output -raw app_url)
          echo "Checking $url"
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$url/api/health" | tee /dev/stderr | grep -q '"status":"ok"'
          echo "::notice title=Deployed::$ENV is live at $url"

      - name: Recent service events on failure
        if: failure() && inputs.action == 'apply'
        run: |
          for svc in api worker frontend; do
            echo "── $svc"
            aws ecs describe-services --cluster "agent-harness-$ENV" \
              --services "agent-harness-$ENV-$svc" \
              --query 'services[0].events[:10].message' --output text || true
          done
