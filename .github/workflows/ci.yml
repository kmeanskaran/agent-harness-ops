# One pipeline: check, then deploy. Checks run on everything; deploys only ever
# happen after all four checks pass.
#
#   CHECKS (no AWS credentials, no deploy)
#     quality    pre-commit (ruff lint+format, terraform fmt, hygiene, secret scan)
#     terraform  validate the Terraform config
#     test       pytest — pure-function unit tests, no services needed
#     smoke      boot the real stack with docker compose and exercise it
#
#   DEPLOY (only on push, never on a PR)
#     push to aws-deployment  ->  dev   (automatic)
#     push tag  prod-*        ->  prod  (pauses for the reviewer on the `prod`
#                                        GitHub Environment)
#
# Promote dev -> prod by tagging the exact commit that is already running in dev:
#     git tag prod-2026-08-12 && git push origin prod-2026-08-12
#
# WHY ONE FILE: chaining a second workflow off this one (`workflow_run`) and the
# manual "Run workflow" button both require the workflow file to live on the
# repo's DEFAULT branch. `master` is deliberately kept free of AWS code, so both
# are unavailable — but plain `push` triggers work from any branch, and the
# approval gate is attached to the Environment rather than the trigger, so
# nothing is lost.
name: ci

on:
  push:
    branches: [master, main, aws-deployment]
    tags: ["prod-*"]
  pull_request:

# A new push to the same ref cancels the previous, still-running pipeline.
# Deploys are excluded from cancellation below via the environment concurrency.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # OIDC, for the deploy jobs

jobs:
  quality:
    name: code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      # The terraform_fmt hook shells out to the terraform binary.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure --color=always

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # -backend=false: validate the config without touching remote state or
      # needing AWS credentials.
      - name: Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # No .env, no Postgres, no Redis, no model — these tests are pure functions.
      - name: pytest
        run: uv run --group dev pytest

  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # compose reads `env_file: .env`; the committed example has safe defaults
      # and compose overrides REDIS_URL/DATABASE_URL for the service network.
      - name: Seed .env
        run: cp .env.example .env

      # --wait blocks until every service with a healthcheck reports healthy,
      # so a boot failure fails the job here rather than in the asserts below.
      - name: Build and start the stack
        run: docker compose up -d --build --wait

      - name: API is healthy and reaches Redis
        run: |
          body=$(curl -fsS --retry 5 --retry-connrefused http://localhost:8000/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: Frontend is served
        run: curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/ | grep -q 200

      # The single most valuable assert: proves nginx's /api proxy is wired, which
      # is exactly how the ALB reaches the API in AWS.
      - name: Frontend proxies /api to the API
        run: curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'

      - name: Worker started without crashing
        run: docker compose ps --services --status running | grep -qx worker

      # tests/test_dependencies.py checks pyproject.toml against the RUNNER's
      # environment. This checks the built IMAGE — the artifact that actually
      # ships. Provider imports in app/agent/model.py are lazy, so a missing
      # package survives boot and the health check and only fails when a job
      # runs with that provider selected (bedrock is the default on AWS).
      - name: Deployed image has every model provider package
        run: |
          docker compose exec -T app python -c "import langchain_ollama, langchain_groq, langchain_openai, langchain_anthropic, langchain_aws, aws_bedrock_token_generator; print('all provider packages present')"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # ===========================================================================
  # DEPLOY — everything below runs only on a push (never a PR) and only after
  # all four checks above are green.
  # ===========================================================================

  # Which environment does this ref target? Empty means "don't deploy".
  target:
    name: resolve target
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      env: ${{ steps.pick.outputs.env }}
    steps:
      - id: pick
        env:
          # Empty until the AWS bootstrap has run and the repo variable is set.
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          # No deploy role configured yet -> run checks only, and stay green.
          # Setting the AWS_DEPLOY_ROLE_ARN repo variable switches deploys on
          # with no change to this file.
          if [ -z "$ROLE" ]; then
            echo "env=" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::AWS_DEPLOY_ROLE_ARN is not set — ran checks only."
            exit 0
          fi
          case "$GITHUB_REF" in
            refs/tags/prod-*)          echo "env=prod" >> "$GITHUB_OUTPUT" ;;
            refs/heads/aws-deployment) echo "env=dev"  >> "$GITHUB_OUTPUT" ;;
            *)                         echo "env="     >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Report
        run: echo "target=${{ steps.pick.outputs.env || 'none — checks only' }}"

  # Chicken-and-egg: the build job pushes to ECR repos that Terraform creates.
  # On the FIRST deploy of a workspace they don't exist yet, so create just those
  # two resources up front. A no-op on every later run.
  ecr:
    name: ensure ECR repos
    needs: [target, quality, terraform, test, smoke]
    if: needs.target.outputs.env != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job also runs `terraform apply` (targeted), so it needs the same
    # protection from cancellation as `deploy`. Its own group, not deploy's, so
    # the two can never wait on each other within a single run.
    concurrency:
      group: ecr-${{ needs.target.outputs.env }}
      cancel-in-progress: false
    env:
      ENV: ${{ needs.target.outputs.env }}
      # A -target'ed apply still evaluates every variable, and budget_email has
      # no default — so this job needs the secret too, not just `deploy`.
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Apply ECR repositories only
        run: |
          cd terraform
          terraform init -backend-config=backend.hcl
          terraform workspace select "$ENV" || terraform workspace new "$ENV"
          terraform apply -auto-approve -no-color -var="aws_profile=" \
            -target=aws_ecr_repository.api \
            -target=aws_ecr_repository.frontend

  build:
    name: build ${{ matrix.image }}
    needs: [target, ecr]
    if: needs.target.outputs.env != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - image: api
            context: .
            dockerfile: Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64 # Fargate x86
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/agent-harness-${{ needs.target.outputs.env }}-${{ matrix.image }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/agent-harness-${{ needs.target.outputs.env }}-${{ matrix.image }}:latest
          # Layer cache scoped per image so api and frontend don't evict each other.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: deploy to ${{ needs.target.outputs.env }}
    needs: [target, build]
    if: needs.target.outputs.env != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Job-level concurrency overrides the workflow-level `cancel-in-progress:
    # true`, which is right for checks and dangerous here: cancelling a run
    # mid-`terraform apply` strands the DynamoDB state lock and blocks every
    # later deploy until someone runs `terraform force-unlock`. Rapid pushes
    # still cancel redundant CHECK runs; an in-flight apply is left alone, and a
    # second deploy to the same environment queues behind it instead of racing.
    concurrency:
      group: deploy-${{ needs.target.outputs.env }}
      cancel-in-progress: false
    # THIS is the approval gate. The `prod` GitHub Environment has a required
    # reviewer, so a prod deploy pauses here until it is approved. `dev` has no
    # protection rules and runs straight through.
    environment: ${{ needs.target.outputs.env }}
    env:
      ENV: ${{ needs.target.outputs.env }}
      TAG: ${{ github.sha }}
      # Budget alert address. Kept out of the repo (public) and supplied here
      # from the BUDGET_EMAIL secret; var.budget_email has no default, so a
      # missing secret fails the apply rather than mailing a stale address.
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # terraform_wrapper mangles stdout, which breaks `terraform output` capture.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init and select workspace
        run: |
          cd terraform
          terraform init -backend-config=backend.hcl
          terraform workspace select "$ENV" || terraform workspace new "$ENV"

      # NOTE: the plan is deliberately NOT uploaded as an artifact. It contains
      # random_password.db in cleartext and artifacts are downloadable by anyone
      # with repo read access. The apply below re-plans internally instead.
      - name: Plan
        run: |
          cd terraform
          terraform plan -no-color -var="aws_profile=" \
            -var="api_image_tag=${TAG}" -var="frontend_image_tag=${TAG}"

      - name: Apply
        run: |
          cd terraform
          terraform apply -auto-approve -no-color -var="aws_profile=" \
            -var="api_image_tag=${TAG}" -var="frontend_image_tag=${TAG}"

      # Task definitions pin :latest, so a same-tag push needs an explicit roll.
      - name: Roll ECS services
        run: |
          for svc in api worker frontend; do
            aws ecs update-service --cluster "agent-harness-$ENV" \
              --service "agent-harness-$ENV-$svc" --force-new-deployment >/dev/null
            echo "rolled $svc"
          done

      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster "agent-harness-$ENV" \
            --services "agent-harness-$ENV-api" \
                       "agent-harness-$ENV-worker" \
                       "agent-harness-$ENV-frontend"

      - name: Post-deploy smoke test
        run: |
          cd terraform
          url=$(terraform output -raw app_url)
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$url/api/health" \
            | tee /dev/stderr | grep -q '"status":"ok"'
          echo "::notice title=Deployed::$ENV is live at $url"

      - name: Recent service events on failure
        if: failure()
        run: |
          for svc in api worker frontend; do
            echo "── $svc"
            aws ecs describe-services --cluster "agent-harness-$ENV" \
              --services "agent-harness-$ENV-$svc" \
              --query 'services[0].events[:10].message' --output text || true
          done
