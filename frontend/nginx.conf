server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location /api/ {
        # ${BACKEND_URL} and ${DNS_RESOLVER} are substituted at container start
        # (envsubst). Local compose: http://app:8000 with Docker's embedded DNS;
        # ECS: http://api.<ns>.local:8000 with the VPC resolver.
        #
        # The upstream MUST be reached through a variable. With a literal
        # hostname, nginx resolves it once at worker startup and caches that IP
        # for the life of the process — so when a Fargate task is replaced and
        # gets a new ENI IP, nginx keeps connecting to the dead address and every
        # /api request returns 502 until the frontend is restarted. Using a
        # variable forces re-resolution against the resolver on each request,
        # honouring the record's TTL.
        resolver ${DNS_RESOLVER} valid=10s ipv6=off;
        set $backend "${BACKEND_URL}";

        # A variable proxy_pass does not do the automatic prefix-stripping that
        # `proxy_pass http://host/;` does, so strip /api/ explicitly.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
