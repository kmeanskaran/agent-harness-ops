# Pre-commit hooks — run automatically on `git commit`.
# Setup (once):   uv sync --group dev  &&  pre-commit install
# Run manually:   pre-commit run --all-files
#
# These run locally on every commit AND in CI (.github/workflows/ci.yml), so the
# same checks gate both your machine and pull requests.

repos:
  # --- General hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key # blocks committing secrets/keys

  # --- Python lint + format (Ruff) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff # lint
        args: ["--fix"]
      - id: ruff-format # format

  # --- Terraform fmt (keeps *.tf tidy) ---
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
