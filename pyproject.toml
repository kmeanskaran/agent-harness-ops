[project]
name = "deepagents-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.6.8",
    "ipykernel>=7.2.0",
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.0",
    "langchain-groq>=1.1.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    # Required by MODEL_PROVIDER=bedrock, which is the default on AWS. The
    # Dockerfile installs from this file, so anything missing here is missing
    # from the image — see tests/test_dependencies.py.
    "langchain-aws>=0.2.10",
    "aws-bedrock-token-generator>=1.0.0",
    "psycopg[binary]>=3.2.9",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.25",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "slowapi>=0.1.9",
    "streamlit>=1.28.0",
    "requests>=2.31.0",
    "langfuse>=2.0.0,<3.0.0",
]

# Dev-only tools. Install with:  uv sync --group dev   (or: uv pip install ruff pre-commit pytest)
[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
]

# --- Ruff: linter + formatter (replaces pylint + flake8 + black + isort) ---
[tool.ruff]
line-length = 100
target-version = "py312"
# App code only; skip generated/vendored dirs.
exclude = ["frontend", ".venv", "node_modules", "terraform", "dist"]

[tool.ruff.lint]
# Pragmatic default for an existing codebase — expand later.
#   E,W pycodestyle · F pyflakes · I import-sort · UP pyupgrade · B bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501", # line length — the formatter handles wrapping
    "B008", # FastAPI uses function calls in argument defaults (Depends())
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # re-exports

[tool.ruff.format]
quote-style = "double"

# --- pytest ---
# `pythonpath = ["."]` puts the repo root on sys.path so tests import `app.*`
# without the project needing to be installed as a package.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
